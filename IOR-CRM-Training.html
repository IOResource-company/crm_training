<style>
:root {
  --primary: #09246B;        /* IO Navy */
  --primary-light: #3A5089;  /* IO Navy 80 */
  --primary-bg: #E6F1FD;     /* IO Blue tint */
  --accent: #0073E6;         /* IO Blue — the spark */
  --accent-light: #3A91EC;
  --bg: #F4F6F9;             /* Cloud */
  --card: #ffffff;
  --text: #1B2433;
  --text-light: #5A6B7C;     /* Steel */
  --border: #D7DCE3;         /* Silver */
  --success: #2E8B57;
  --success-bg: #eaf6ef;
  --warning: #D4A017;
  --warning-bg: #fbf3da;
  --danger: #C0392B;
  --danger-bg: #fbeceA;
  --info: #0073E6;
  --info-bg: #E6F1FD;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;font-size:15px;}

header{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;padding:1.75rem 2rem;text-align:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.18);}
header h1{font-size:1.5rem;font-weight:700;margin-bottom:.2rem;}
header p{opacity:.85;font-size:.85rem;}
.logo-lockup{display:flex;justify-content:center;margin-bottom:.7rem;}
.logo-lockup svg{height:42px;width:auto;}

.nav{display:flex;gap:.4rem;justify-content:center;flex-wrap:wrap;padding:.7rem 1rem;background:#fff;border-bottom:2px solid var(--border);position:sticky;top:72px;z-index:99;}
.nb{padding:.4rem .85rem;border:2px solid var(--primary);border-radius:20px;background:#fff;color:var(--primary);cursor:pointer;font-size:.78rem;font-weight:600;transition:.2s;}
.nb:hover,.nb.active{background:var(--primary);color:#fff;}
.nb.qb{border-color:var(--accent);color:var(--accent);}
.nb.qb:hover,.nb.qb.active{background:var(--accent);color:#fff;}
.nb.sb{border-color:var(--success);color:var(--success);}
.nb.sb:hover,.nb.sb.active{background:var(--success);color:#fff;}
.nb.ob{border-color:#975a16;color:#975a16;}
.nb.ob:hover,.nb.ob.active{background:#975a16;color:#fff;}
.nb.cb{border-color:var(--warning);color:#8a6d1a;}
.nb.cb:hover,.nb.cb.active{background:var(--warning);color:#fff;}

.container{max-width:1100px;margin:0 auto;padding:1.5rem;}
.sec{display:none;}.sec.active{display:block;}

.card{background:var(--card);border-radius:12px;margin-bottom:1.25rem;box-shadow:0 1px 4px rgba(0,0,0,.06);border:1px solid var(--border);overflow:hidden;}
.card-h{padding:1rem 1.25rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none;transition:background .15s;}
.card-h:hover{background:#f7fafc;}
.card-h h2{font-size:1.1rem;}
.card-h h3{font-size:1rem;}
.chev{transition:transform .3s;font-size:1.1rem;color:var(--text-light);}
.card.open .chev{transform:rotate(180deg);}
.card-b{display:none;padding:0 1.25rem 1.25rem;}
.card.open .card-b{display:block;}

.banner{border-radius:12px;padding:1.2rem;margin-bottom:1.5rem;border:1px solid;}
.banner-blue{background:linear-gradient(135deg,#ebf8ff,#e6fffa);border-color:#bee3f8;}
.banner-amber{background:var(--warning-bg);border-color:#fbd38d;}
.banner-red{background:var(--danger-bg);border-color:#feb2b2;}
.banner h3{font-size:1rem;margin-bottom:.5rem;color:var(--primary);}

.stats{display:flex;gap:.75rem;flex-wrap:wrap;}
.stat{background:#fff;border-radius:8px;padding:.55rem .9rem;flex:1;min-width:130px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.07);}
.stat .v{font-size:1.25rem;font-weight:700;color:var(--primary);}
.stat .l{font-size:.72rem;color:var(--text-light);}

.overview{background:#f7fafc;border-radius:8px;padding:1rem;margin-bottom:1rem;font-size:.88rem;}
.overview p{margin-bottom:.6rem;}
.overview p:last-child{margin-bottom:0;}

.st{width:100%;border-collapse:collapse;margin-bottom:.7rem;}
.st td{padding:.35rem .5rem;border-bottom:1px solid var(--border);vertical-align:top;font-size:.85rem;}
.st td:first-child{font-weight:600;color:var(--primary);width:32%;font-size:.78rem;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}

.kp{background:var(--info-bg);border-left:3px solid var(--accent);padding:.5rem .7rem;margin-top:.5rem;border-radius:0 6px 6px 0;font-size:.82rem;}
.kp strong{color:var(--accent);}
.cn{background:#fff5f5;border-left:3px solid var(--danger);padding:.5rem .7rem;margin-top:.5rem;border-radius:0 6px 6px 0;font-size:.82rem;}
.cn strong{color:var(--danger);}
.tip{background:var(--info-bg);border-left:3px solid var(--info);padding:.5rem .7rem;margin-top:.5rem;border-radius:0 6px 6px 0;font-size:.82rem;}
.imp{background:var(--warning-bg);border-left:3px solid var(--warning);padding:.5rem .7rem;margin-top:.5rem;border-radius:0 6px 6px 0;font-size:.82rem;}
.imp strong{color:#8a6d1a;}
.confirm{background:#fffaf0;border:1px dashed var(--warning);border-left:3px solid var(--warning);padding:.5rem .7rem;margin-top:.5rem;border-radius:0 6px 6px 0;font-size:.82rem;color:#7a5c12;}
.confirm strong{color:#8a6d1a;}

.ct{width:100%;border-collapse:collapse;font-size:.82rem;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:1.5rem;}
.ct th{background:var(--primary);color:#fff;padding:.55rem .7rem;text-align:left;font-weight:600;font-size:.78rem;}
.ct td{padding:.45rem .7rem;border-bottom:1px solid var(--border);vertical-align:top;}
.ct tr:nth-child(even){background:#f7fafc;}
.ct code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.95em;color:var(--primary);}

.badge{font-size:.68rem;font-weight:700;padding:.15rem .5rem;border-radius:10px;text-transform:uppercase;display:inline-block;vertical-align:middle;}
.b-blue{background:var(--info-bg);color:var(--info);}
.b-amber{background:#fefcbf;color:#975a16;}
.b-green{background:var(--success-bg);color:var(--success);}
.b-red{background:var(--danger-bg);color:var(--danger);}

/* ---- how-to cards ---- */
.ht{background:#fff;border:1px solid var(--border);border-radius:10px;margin-bottom:1rem;overflow:hidden;}
.ht-h{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;padding:.7rem 1rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
.ht-h h3{font-size:.95rem;font-weight:600;}
.ht-h .chev{color:#fff;}
.ht-b{padding:1rem;font-size:.87rem;}
.ht.closed .ht-b{display:none;}
.ht .when{font-size:.8rem;color:var(--text-light);background:#f7fafc;border-radius:6px;padding:.45rem .7rem;margin-bottom:.7rem;}
.ht .when strong{color:var(--primary);}
.ht ol{margin:.3rem 0 .3rem 1.3rem;}
.ht ol li{margin-bottom:.4rem;}
.ht ol li code,.ht code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--primary-bg);color:var(--primary);padding:.05rem .3rem;border-radius:4px;font-size:.9em;word-break:break-word;}
.ht pre{background:#0f1b3d;color:#e6edf7;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.78rem;line-height:1.5;padding:.75rem .9rem;border-radius:8px;margin:.5rem 0;overflow-x:auto;}
.ht pre code{background:none;color:inherit;padding:0;}

/* ---- screenshots ---- */
.shot{margin:.8rem 0;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff;}
.shot img{display:block;width:100%;height:auto;}
.shot .cap{font-size:.76rem;color:var(--text-light);padding:.45rem .7rem;background:#f7fafc;border-top:1px solid var(--border);}
.shot-ph{margin:.8rem 0;border:2px dashed var(--border);border-radius:10px;background:#fbfcfd;color:var(--text-light);font-size:.82rem;padding:1.1rem;text-align:center;}
.shot-ph .lbl{font-size:.68rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:.3rem;}

.quiz-card{background:#fff;border-radius:12px;padding:1.5rem;margin-bottom:1.25rem;box-shadow:0 1px 4px rgba(0,0,0,.06);border:1px solid var(--border);}
.quiz-card h3{font-size:.95rem;margin-bottom:.9rem;color:var(--primary);}
.qopts{display:flex;flex-direction:column;gap:.45rem;}
.qo{padding:.6rem 1rem;border:2px solid var(--border);border-radius:8px;cursor:pointer;transition:.2s;font-size:.85rem;}
.qo:hover{border-color:var(--primary);background:var(--primary-bg);}
.qo.correct{border-color:var(--success);background:var(--success-bg);}
.qo.wrong{border-color:var(--danger);background:var(--danger-bg);}
.qo.disabled{pointer-events:none;opacity:.7;}
.qfb{margin-top:.7rem;padding:.65rem;border-radius:8px;font-size:.83rem;display:none;}
.qfb.show{display:block;}
.qfb.cfb{background:var(--success-bg);color:#276749;}
.qfb.wfb{background:var(--danger-bg);color:#9b2c2c;}

.score-bar{background:#fff;border-radius:12px;padding:1.15rem;margin-bottom:1.5rem;box-shadow:0 1px 4px rgba(0,0,0,.06);border:1px solid var(--border);text-align:center;}
.score-bar .sv{font-size:1.8rem;font-weight:700;color:var(--primary);}
.score-bar .sl{color:var(--text-light);font-size:.82rem;}
.ptrack{width:100%;height:7px;background:var(--border);border-radius:4px;margin-top:.6rem;overflow:hidden;}
.pfill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-light));border-radius:4px;transition:width .4s;}
.rbtn{display:inline-block;margin-top:.8rem;padding:.45rem 1.3rem;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;font-size:.82rem;}
.rbtn:hover{background:var(--warning);}

.selbar{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.25rem;}
.selb{padding:.35rem .8rem;border:2px solid var(--accent);border-radius:18px;background:#fff;color:var(--accent);cursor:pointer;font-size:.76rem;font-weight:600;transition:.2s;}
.selb:hover,.selb.active{background:var(--accent);color:#fff;}

.fc-wrap{perspective:1000px;margin-bottom:1rem;}
.fc{width:100%;min-height:220px;cursor:pointer;position:relative;transform-style:preserve-3d;transition:transform .5s;}
.fc.flipped{transform:rotateY(180deg);}
.fc-face{position:absolute;width:100%;min-height:220px;backface-visibility:hidden;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;font-size:1rem;line-height:1.5;}
.fc-front{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;}
.fc-back{background:#fff;border:2px solid var(--accent);transform:rotateY(180deg);color:var(--text);}
.fc-brand{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;opacity:.8;margin-bottom:.6rem;font-weight:700;}
.fc-nav{display:flex;justify-content:center;gap:.75rem;margin-top:.5rem;}
.fcb{padding:.4rem 1.3rem;border:2px solid var(--primary);border-radius:8px;background:#fff;color:var(--primary);cursor:pointer;font-weight:600;font-size:.82rem;}
.fcb:hover{background:var(--primary);color:#fff;}
.fcc{text-align:center;color:var(--text-light);font-size:.83rem;margin-bottom:.6rem;}

.sc-card{background:#fff;border-radius:12px;padding:1.5rem;margin-bottom:1.25rem;border:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,.06);}
.sc-card .sc-brand{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);font-weight:700;margin-bottom:.5rem;}
.sc-card .scenario{background:var(--primary-bg);border-radius:8px;padding:1rem;margin-bottom:1rem;font-size:.9rem;font-style:italic;color:var(--primary);}
.sc-card h3{font-size:.95rem;color:var(--primary);margin-bottom:.75rem;}

.mod-quiz{margin-top:1.5rem;border-top:2px dashed var(--border);padding-top:1.25rem;}
.mod-quiz h3.bqh{color:var(--accent);font-size:1rem;margin-bottom:1rem;}

h2.sech{margin-bottom:1rem;color:var(--primary);}
h3.subh{color:var(--primary);font-size:1rem;margin:1.4rem 0 .7rem;}
.sub{color:var(--text-light);margin-bottom:1.25rem;font-size:.88rem;}
ul.pl{margin:.4rem 0 .4rem 1.2rem;}ul.pl li{margin-bottom:.3rem;font-size:.85rem;}
ol.nl{margin:.4rem 0 .4rem 1.3rem;}ol.nl li{margin-bottom:.45rem;font-size:.87rem;}

/* ---- quick start ---- */
.qs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.9rem;margin-bottom:1.5rem;}
.qs-item{background:#fff;border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:10px;padding:.85rem 1rem;font-size:.86rem;}
.qs-item .n{display:inline-block;background:var(--primary);color:#fff;font-size:.72rem;font-weight:700;border-radius:50%;width:22px;height:22px;line-height:22px;text-align:center;margin-right:.4rem;}
.qs-item h4{display:inline;font-size:.9rem;color:var(--primary);}
.qs-item p{margin-top:.4rem;color:var(--text);}

@media(max-width:640px){
header{position:static;padding:1rem 1rem .9rem;}
header h1{font-size:1.15rem;}
header p{font-size:.75rem;}
.logo-lockup{margin-bottom:.45rem;}
.logo-lockup svg{height:30px;}
.nav{position:sticky;top:0;gap:.25rem;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;-webkit-overflow-scrolling:touch;padding:.55rem .75rem;}
.nb{font-size:.7rem;padding:.3rem .55rem;flex:0 0 auto;white-space:nowrap;}
.container{padding:1rem .85rem;}
.qs-grid{grid-template-columns:1fr;}
.stats{flex-direction:column;}
.st td:first-child{width:40%;}
}
</style>

  intro: "<p>A <strong>Case</strong> is the Customer Operations queue. If a customer asks a question, chases a delivery, complains, wants to return something, queries an invoice or has a technical problem, it becomes a Case. Deals in flight are Opportunities; money and documents live in Intact; everything else that needs someone to own it and drive it to done is a Case.</p><p>Every case carries the four non-negotiables: <strong>one named owner, one current status, one next action and one due date</strong>. Nothing else is mandatory, because that is the minimum that makes an item workable — and it is the standard we hold.</p><p>The clever part is that the case measures itself. Moving the status stamps the SLA timestamps for you, and those stamps are what produce the acknowledgement and response numbers in the Ops Pulse email. Keep the status honest and the reporting happens on its own.</p>",

  intro: "<p>This is the boundary that matters most, so learn it before anything else: <strong>quotes, pro formas, orders, invoices and credit notes are made in Intact and live in Intact.</strong> You will not find an order object in the CRM, and you should not try to recreate one. Intact owns the money and the documents. The CRM owns the relationship and the control layer — who the customer is, who owns them, what is in flight, what the next action is and whether we are on time.</p><p>Two things join the two systems, and both are habits rather than integrations. The <strong>Intact A/C code</strong> is stored on the company record as <strong>Account code</strong>, so any customer in the CRM can be matched to their Intact account. And the <strong>document number goes in the email subject</strong>, every time, so a quotation, pro forma or sales order can be traced back to the right record.</p><p>The other boundary is human: <em>if it is about winning the money it is sales; if it is about delivering on the promise it is Customer Operations.</em> When in doubt it goes through sales@ and gets an owner either way.</p>",

/* ===================== ENGINE + RENDER ===================== */
const MODULES = DATA.modules;
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

const TRACK = {
  all:   {cls:'b-blue',  label:'Everyone',        nav:''},
  sales: {cls:'b-green', label:'Sales',           nav:'sb'},
  ops:   {cls:'b-amber', label:'Customer Ops',    nav:'ob'}
};

/* ---------- QUIZ REGISTRY ---------- */
const QREG = {};
function regQuiz(key, items, withScore){ QREG[key] = {items:items||[], sc:0, ans:0, withScore:!!withScore}; }
function quizHTML(key){
  const r = QREG[key]; if(!r) return '';
  let html = '';
  if(r.withScore){
    html += `<div class="score-bar"><div class="sv" id="${key}-sv">0 / 0</div><div class="sl">Correct Answers</div><div class="ptrack"><div class="pfill" id="${key}-pf" style="width:0%"></div></div><button class="rbtn" onclick="resetQuiz('${key}')">Reset Quiz</button></div>`;
  }
  if(!r.items.length){ html += '<p class="sub">No questions in this set yet.</p>'; return html; }
  html += r.items.map((q,i)=>`<div class="quiz-card"><h3>Q${i+1}. ${esc(q.q)}</h3><div class="qopts">${q.o.map((o,j)=>`<div class="qo" onclick="ansQ('${key}',${i},${j},this)">${esc(o)}</div>`).join('')}</div><div class="qfb" id="${key}-f${i}"></div></div>`).join('');
  return html;
}
function ansQ(key,i,j,el){
  const r=QREG[key]; const q=r.items[i];
  const os=el.parentElement.querySelectorAll('.qo');
  if(os[0].classList.contains('disabled')) return;
  os.forEach(o=>o.classList.add('disabled'));
  os[q.c].classList.add('correct');
  if(j!==q.c) el.classList.add('wrong');
  const f=document.getElementById(`${key}-f${i}`);
  if(j===q.c){ r.sc++; f.className='qfb show cfb'; f.textContent='Correct! '+q.e; }
  else { f.className='qfb show wfb'; f.textContent='Not quite. '+q.e; }
  r.ans++;
  if(r.withScore) updScore(key);
}
function updScore(key){
  const r=QREG[key];
  const sv=document.getElementById(`${key}-sv`); if(sv) sv.textContent=`${r.sc} / ${r.ans}`;
  const pf=document.getElementById(`${key}-pf`); if(pf) pf.style.width=(r.items.length? (r.ans/r.items.length)*100:0)+'%';
}

/* ---------- SCREENSHOT / PLACEHOLDER ---------- */
function shotHTML(key, caption){
  if(!key) return '';
  const src = SHOTS[key];
  if(src) return `<div class="shot"><img src="${src}" alt="${esc(caption||key)}" loading="lazy">${caption?`<div class="cap">${esc(caption)}</div>`:''}</div>`;
  return `<div class="shot-ph"><div class="lbl">Screenshot</div>${esc(caption||key)}</div>`;
}

/* ---------- MODULE SECTION ---------- */
function moduleSectionHTML(m){
  const tk = TRACK[m.track] || TRACK.all;
  const qkey = 'q_'+m.slug;
  regQuiz(qkey, m.quiz, false);
  let h = `<h2 class="sech">${esc(m.name)} <span class="badge ${tk.cls}">${tk.label}</span></h2>`;
  if(m.tagline) h += `<p class="sub">${esc(m.tagline)}</p>`;
  if(m.intro) h += `<div class="overview">${m.intro}</div>`;

  (m.shots||[]).forEach(s=>{ h += shotHTML(s.key||s, s.cap||''); });

  if(m.howtos && m.howtos.length){
    h += `<h3 class="subh">How to — step by step <span style="font-weight:400;font-size:.8rem;color:var(--text-light);">(click a heading to collapse)</span></h3>`;
    h += m.howtos.map(ht=>{
      let b = '';
      if(ht.when) b += `<div class="when"><strong>When:</strong> ${esc(ht.when)}</div>`;
      if(ht.steps && ht.steps.length) b += `<ol>${ht.steps.map(s=>`<li>${s}</li>`).join('')}</ol>`;
      if(ht.shot) b += shotHTML(ht.shot.key||ht.shot, ht.shot.cap||'');
      if(ht.tip) b += `<div class="tip"><strong>Tip:</strong> ${ht.tip}</div>`;
      if(ht.important) b += `<div class="imp"><strong>Important:</strong> ${ht.important}</div>`;
      if(ht.mistake) b += `<div class="cn"><strong>Easy to get wrong:</strong> ${ht.mistake}</div>`;
      if(ht.confirm) b += `<div class="confirm"><strong>Needs confirmation:</strong> ${esc(ht.confirm)}</div>`;
      return `<div class="ht"><div class="ht-h" onclick="togH(this)"><h3>${esc(ht.title)}</h3><span class="chev">⌄</span></div><div class="ht-b">${b}</div></div>`;
    }).join('');
  }

  if(m.fields && m.fields.length){
    h += `<div class="card open"><div class="card-h" onclick="tog(this)"><h3>Fields that matter</h3><span class="chev">⌄</span></div><div class="card-b"><table class="st">${m.fields.map(f=>`<tr><td>${esc(f.k)}</td><td>${f.v}</td></tr>`).join('')}</table></div></div>`;
  }
  if(m.tips && m.tips.length){
    h += `<div class="card open"><div class="card-h" onclick="tog(this)"><h3>Tips</h3><span class="chev">⌄</span></div><div class="card-b">${m.tips.map(t=>`<div class="tip">${t}</div>`).join('')}</div></div>`;
  }
  if(m.mistakes && m.mistakes.length){
    h += `<div class="card open"><div class="card-h" onclick="tog(this)"><h3>Traps and the habits that avoid them</h3><span class="chev">⌄</span></div><div class="card-b">${m.mistakes.map(x=>`<div class="cn"><strong>${esc(x.m)}</strong><br>${x.fix}</div>`).join('')}</div></div>`;
  }
  if(m.confirms && m.confirms.length){
    h += `<div class="card"><div class="card-h" onclick="tog(this)"><h3>Needs confirmation (${m.confirms.length})</h3><span class="chev">⌄</span></div><div class="card-b">${m.confirms.map(c=>`<div class="confirm">${esc(c)}</div>`).join('')}</div></div>`;
  }

  h += `<div class="mod-quiz"><h3 class="bqh">Test yourself — ${esc(m.name)}</h3>${quizHTML(qkey)}</div>`;
  return h;
}

/* ---------- ITEMS TO CONFIRM (generated from DATA) ---------- */
function collectConfirms(){
  const out = [];
  MODULES.forEach(m=>{
    (m.confirms||[]).forEach(c=>out.push({mod:m.name, q:c}));
    (m.howtos||[]).forEach(h=>{ if(h.confirm) out.push({mod:m.name, q:h.confirm, ctx:h.title}); });
  });
  return out;
}
function confirmHTML(){
  const items = collectConfirms();
  let h = `<h2 class="sech">Items to Confirm</h2>
  <p class="sub">Everything on this page is either not yet verified against our live CRM, or is a policy question for an administrator. Nothing here is a guess presented as fact — where the guide could not confirm something, it says so at the point of use and repeats it below.</p>
  <div class="banner banner-amber"><h3>How to use this list</h3><p>Work through it with an administrator (Stephen) or by testing in the CRM. As each item is confirmed, the answer belongs in the relevant module — and the item comes off this list.</p></div>`;
  if(!items.length){ h += `<p class="sub">Nothing outstanding.</p>`; return h; }
  h += `<table class="ct"><tr><th style="width:44px;">#</th><th style="width:22%;">Module</th><th>Question to confirm</th></tr>`;
  h += items.map((it,i)=>`<tr><td>${i+1}</td><td>${esc(it.mod)}</td><td>${it.ctx?`<em>${esc(it.ctx)}</em> — `:''}${esc(it.q)}</td></tr>`).join('');
  h += `</table>`;
  return h;
}

/* ---------- FLASHCARDS ---------- */
let fcs = [], ci = 0;
function buildFcs(){ fcs = []; MODULES.forEach(m=>(m.flashcards||[]).forEach(f=>fcs.push({q:f.q,a:f.a,mod:m.name}))); }
function renderFC(){
  if(!fcs.length) return;
  document.getElementById('fcBrand').textContent = fcs[ci].mod;
  document.getElementById('fcF').textContent = fcs[ci].q;
  document.getElementById('fcB').textContent = fcs[ci].a;
  document.getElementById('fc').classList.remove('flipped');
  document.getElementById('fcc').textContent = `Card ${ci+1} of ${fcs.length}`;
}
function flip(){ document.getElementById('fc').classList.toggle('flipped'); }
function nextFc(){ ci=(ci+1)%fcs.length; renderFC(); }
function prevFc(){ ci=(ci-1+fcs.length)%fcs.length; renderFC(); }
function shufFc(){ for(let i=fcs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[fcs[i],fcs[j]]=[fcs[j],fcs[i]];} ci=0; renderFC(); }

/* ---------- MAIN QUIZ (with selector) ---------- */
let quizSel = 'all';
function buildMainQuiz(slug){
  quizSel = slug;
  let items = [];
  if(slug==='all'){ MODULES.forEach(m=>(m.quiz||[]).forEach(q=>items.push(q))); }
  else { const m=MODULES.find(x=>x.slug===slug); items=(m&&m.quiz)?m.quiz.slice():[]; }
  regQuiz('main', items, true);
  document.getElementById('quizmount').innerHTML = quizHTML('main');
  document.querySelectorAll('#quizsel .selb').forEach(x=>x.classList.toggle('active', x.dataset.s===slug));
}
function resetQuiz(key){
  if(key==='main'){ buildMainQuiz(quizSel); return; }
  const r=QREG[key]; if(!r) return; r.sc=0; r.ans=0;
}

/* ---------- SCENARIOS ---------- */
function buildScenarios(){
  const items=[];
  MODULES.forEach(m=>(m.scenarios||[]).forEach(s=>items.push(Object.assign({mod:m.name},s))));
  const c=document.getElementById('scenC'); c.innerHTML='';
  items.forEach((s,i)=>{
    const d=document.createElement('div'); d.className='sc-card';
    d.innerHTML=`<div class="sc-brand">${esc(s.mod)}</div><div class="scenario">${esc(s.scenario)}</div><h3>${esc(s.q)}</h3><div class="qopts">${s.o.map((o,j)=>`<div class="qo" onclick="ansSc(this,${i},${j})">${esc(o)}</div>`).join('')}</div><div class="qfb" id="scf${i}"></div>`;
    c.appendChild(d);
  });
  window.__scen = items;
}
function ansSc(el,si,oi){
  const s=window.__scen[si];
  const os=el.parentElement.querySelectorAll('.qo');
  if(os[0].classList.contains('disabled')) return;
  os.forEach(o=>o.classList.add('disabled'));
  os[s.c].classList.add('correct');
  if(oi!==s.c) el.classList.add('wrong');
  const f=document.getElementById(`scf${si}`);
  if(oi===s.c){ f.className='qfb show cfb'; f.textContent='Spot on! '+s.e; }
  else { f.className='qfb show wfb'; f.textContent='Not the best answer. '+s.e; }
}

/* ---------- NAV + SECTIONS ---------- */
function tog(el){ el.closest('.card').classList.toggle('open'); }
function togH(el){ el.closest('.ht').classList.toggle('closed'); }
function go(id, btn){
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));
  const sec=document.getElementById('sec-'+id); if(sec) sec.classList.add('active');
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  window.scrollTo(0,0);
}
function goSlug(slug){
  const btn = document.querySelector(`.nb[data-id="m_${slug}"]`);
  go('m_'+slug, btn);
}
function buildNav(){
  const nav=document.getElementById('nav');
  const items=[];
  items.push({id:'quickstart',label:'Quick Start'});
  MODULES.forEach(m=>items.push({id:'m_'+m.slug,label:m.name, cls:(TRACK[m.track]||TRACK.all).nav}));
  items.push({id:'cheat',label:'Cheat Sheet'});
  items.push({id:'confirm',label:'Items to Confirm',cls:'cb'});
  items.push({id:'flashcards',label:'Flashcards',cls:'qb'});
  items.push({id:'quiz',label:'Quiz',cls:'qb'});
  items.push({id:'scenarios',label:'Scenarios',cls:'qb'});
  nav.innerHTML = items.map((it,i)=>`<button class="nb ${it.cls||''}${i===0?' active':''}" data-id="${it.id}" onclick="go('${it.id}',this)">${esc(it.label)}</button>`).join('');
}
function sec(id, html, active){ return `<div id="sec-${id}" class="sec${active?' active':''}">${html}</div>`; }
function buildSections(){
  const c=document.getElementById('container');
  let html='';
  html += sec('quickstart', quickStartHTML(), true);
  MODULES.forEach(m=>{ html += sec('m_'+m.slug, moduleSectionHTML(m)); });
  html += sec('cheat', cheatHTML());
  html += sec('confirm', confirmHTML());
  html += sec('flashcards', `<h2 class="sech">Flashcards</h2><p class="sub">Flip through the key facts from every module. Click a card to flip.</p><div class="fcc" id="fcc">Card 1</div><div class="fc-wrap"><div class="fc" id="fc" onclick="flip()"><div class="fc-face fc-front"><div class="fc-brand" id="fcBrand"></div><div id="fcF"></div></div><div class="fc-face fc-back"><div id="fcB"></div></div></div></div><div class="fc-nav"><button class="fcb" onclick="prevFc()">‹ Prev</button><button class="fcb" onclick="shufFc()">⤮ Shuffle</button><button class="fcb" onclick="nextFc()">Next ›</button></div>`);
  const selBtns = `<button class="selb active" data-s="all" onclick="buildMainQuiz('all')">Everything</button>` + MODULES.filter(m=>(m.quiz||[]).length).map(m=>`<button class="selb" data-s="${m.slug}" onclick="buildMainQuiz('${m.slug}')">${esc(m.name)}</button>`).join('');
  html += sec('quiz', `<h2 class="sech">Knowledge Quiz</h2><p class="sub">Pick a module or test yourself across the whole guide.</p><div class="selbar" id="quizsel">${selBtns}</div><div id="quizmount"></div>`);
  html += sec('scenarios', `<h2 class="sech">Scenario Challenges</h2><p class="sub">Real situations — pick the right thing to do in the CRM.</p><div id="scenC"></div>`);
  c.innerHTML = html;
}
function init(){
  buildNav();
  buildSections();
  buildFcs(); renderFC();
  buildMainQuiz('all');
  buildScenarios();
}
document.addEventListener('DOMContentLoaded', init);
</script>
